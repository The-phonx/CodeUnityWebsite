<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Colorful coding project illustration</title>
  <desc id="description">An abstract laptop displaying code, surrounded by colorful shapes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="0.52" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#background)"/>
  <circle cx="144" cy="154" r="86" fill="#818cf8" opacity="0.26"/>
  <circle cx="1046" cy="726" r="126" fill="#2dd4bf" opacity="0.24"/>
  <path d="M965 122l69 39-23 76-82 7-33-72z" fill="#38bdf8" opacity="0.28"/>
  <path d="M173 668l95 18-12 92-104 16-42-72z" fill="#4f46e5" opacity="0.18"/>

  <g filter="url(#shadow)">
    <rect x="238" y="190" width="724" height="470" rx="38" fill="#fff"/>
    <rect x="272" y="224" width="656" height="382" rx="20" fill="url(#screen)"/>
    <circle cx="318" cy="267" r="10" fill="#fb7185"/>
    <circle cx="350" cy="267" r="10" fill="#fbbf24"/>
    <circle cx="382" cy="267" r="10" fill="#34d399"/>

    <path d="M410 357l-72 62 72 62" fill="none" stroke="#67e8f9" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M790 357l72 62-72 62" fill="none" stroke="#a5b4fc" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M653 326l-102 188" fill="none" stroke="#5eead4" stroke-width="24" stroke-linecap="round"/>

    <rect x="454" y="342" width="154" height="18" rx="9" fill="#c7d2fe" opacity="0.9"/>
    <rect x="454" y="383" width="108" height="18" rx="9" fill="#99f6e4" opacity="0.92"/>
    <rect x="638" y="468" width="112" height="18" rx="9" fill="#bae6fd" opacity="0.92"/>
    <rect x="638" y="509" width="158" height="18" rx="9" fill="#c7d2fe" opacity="0.9"/>

    <path d="M178 661h844l-76 76H254z" fill="#e2e8f0"/>
    <path d="M460 661h280l-22 34H482z" fill="#cbd5e1"/>
